[package]
name = "chatgpt-controller-native"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Native Rust localhost HTTP API controller for a user-managed ChatGPT browser"

[dependencies]
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
