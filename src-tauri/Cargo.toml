[package]
name = "chatgpt-controller-desktop"
version = "0.3.0"
description = "Local ChatGPT browser controller and API manager"
license = "AGPL-3.0-or-later"
authors = ["ChatGPT Controller Contributors"]
edition = "2024"

[lib]
name = "chatgpt_controller_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
chatgpt-controller-native = { path = "../native-controller" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
